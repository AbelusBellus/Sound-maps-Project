<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sound Maps — Москва</title>
    <!-- Leaflet CSS + плагин эллипсов -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Наши стили -->
    <link rel="stylesheet" href="Page2.css">
    <!-- Шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;600&display=swap" rel="stylesheet">
    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Leaflet JS и плагин эллипсов -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-ellipse@0.1.0/leaflet-ellipse.js"></script>
    <!-- Pannellum -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
</head>
<body>
<div class="page">
    <!-- Десктопные фоны -->
    <img src="Images/BG1-1.png" class="bg bg-1 desktop-bg" alt="">
    <!-- Мобильный фон BG2-1.png -->
    <img src="Images/BG2-1.png" class="bg-mobile bg2-1" alt="">

    <!-- Вектор под названием города (стрелка) -->
    <img src="Images/Vector1.png" class="vector" alt="">

    <!-- Текст "sound maps" -->
    <div class="title">sound maps</div>

    <!-- Номер страницы (скрыт на мобильных? В макете не указан, но можно оставить) -->
    <div class="page-number">page 2</div>

    <!-- Название города -->
    <div class="city-name">Moscow</div>

    <!-- Кнопка Noise map -->
    <div class="noise-map-btn" id="noiseMapBtn">
        <div class="checkbox"></div>
        <span class="btn-text">Noise map</span>
    </div>

    <!-- Контейнер для карты -->
    <div id="mapContainer">
        <div id="map"></div>
    </div>

    <!-- Панель кнопок времени суток (будет расположена под картой на мобильных) -->
    <div class="time-buttons">
        <button class="time-btn" data-phase="morning">Morning</button>
        <button class="time-btn" data-phase="day">Day</button>
        <button class="time-btn" data-phase="evening">Evening</button>
        <button class="time-btn" data-phase="night">Night</button>
    </div>

    <!-- Невидимая кнопка авторизации -->
    <div id="invisibleAuthBtn"></div>

    <!-- Административная панель -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <h3>Управление маркерами (Москва)</h3>
        <div class="admin-form">
            <button id="clearMarkersBtn">🗑️ Очистить все маркеры</button>
        </div>
        <div id="markersList"></div>
    </div>

    <!-- Глобальный оверлей -->
    <div id="globalTint" class="global-tint"></div>
</div>

<!-- Контейнер для 360-панорамы -->
<div id="panoramaContainer" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: black;">
    <button id="closePanoramaBtn" style="position: absolute; top: 20px; right: 20px; z-index: 1001; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 24px; cursor: pointer;">✕</button>
    <div id="pannellumContainer" style="width: 100%; height: 100%;"></div>
</div>

<script src="Page2.js"></script>
</body>
</html>
