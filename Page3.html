<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sound Maps — Подольск</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="Page3.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-ellipse@0.1.0/leaflet-ellipse.js"></script>
</head>
<body>
<div class="page">
    <!-- Десктопный фон -->
    <img src="Images/BG1-1.png" class="bg bg-1 desktop-bg" alt="">
    <!-- Мобильный фон -->
    <img src="Images/BG2-1.png" class="bg-mobile bg2-1" alt="">

    <!-- Векторная стрелка -->
    <img src="Images/Vector1.png" class="vector" alt="">

    <!-- Верхняя строка -->
    <div class="title">sound maps</div>
    <div class="page-number">page 3</div>
    <div class="city-name">Podolsk</div>

    <!-- Кнопка Noise map -->
    <div class="noise-map-btn" id="noiseMapBtn">
        <div class="checkbox"></div>
        <span class="btn-text">Noise map</span>
    </div>

    <!-- Контейнер карты -->
    <div id="mapContainer">
        <div id="map"></div>
    </div>

    <!-- Информационная панель под картой (появляется при клике на маркер) -->
    <div id="infoPanel" class="info-panel" style="display: none;">
        <div class="time-container">
            <input type="range" id="timeSlider" class="time-slider" min="0" max="100" value="0" step="0.01">
        </div>
        <div class="coordinate-row">
            <span class="label">the coordinate</span>
            <span class="coordinate-value" id="coordinateValue">0, 0</span>
        </div>
        <div class="location-row">
            <span class="label">location</span>
            <span class="location-value" id="locationValue">—</span>
        </div>
        <div class="volume-wrapper">
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>
    </div>

    <!-- Невидимая кнопка авторизации -->
    <div id="invisibleAuthBtn"></div>

    <!-- Админ-панель -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <h3>Управление маркерами (Подольск)</h3>
        <div class="admin-form">
            <button id="clearMarkersBtn">🗑️ Очистить все маркеры</button>
        </div>
        <div id="markersList"></div>
    </div>

    <!-- Глобальная тонировка -->
    <div id="globalTint" class="global-tint"></div>
</div>

<script src="Page3.js"></script>
</body>
</html>
